<text x="56" y="59" fill="#f1f7fe" font-size="30" font-family="Segoe UI,Arial,sans-serif" font-weight="700">CAUSAL DATA CONTRACT</text>
<text x="56" y="94" fill="#95afc2" font-size="19" font-family="Segoe UI,Arial,sans-serif">A decision cannot access a higher-timeframe bar before it is completed and received.</text>
