<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="mTitle mDesc">
<title id="mTitle">Point-in-time information availability for multi-timeframe trading</title>
<desc id="mDesc">At a 12:03 decision, only completed and received one-minute bars and the five-minute bar ending at 12:00 are usable; the five-minute bar ending at 12:05 remains unknown.</desc>
